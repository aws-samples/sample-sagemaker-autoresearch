[project]
name = "sm-research-scripts"
version = "0.1.0"
description = "SageMaker Auto Research helper scripts"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto>=5.0",
    "pandas>=3.0.6",
]

# sm_research lives under scripts/, not at the project root. Without this the
# package is importable only via the pytest-only pythonpath below, so the
# skill's documented `uv run python -m sm_research.<module>` fails on a clean
# install with ModuleNotFoundError.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/sm_research"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
